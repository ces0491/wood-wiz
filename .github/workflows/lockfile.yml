name: Lockfile sync

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile.yml

permissions:
  contents: write
  # To re-dispatch Test after a sync — see the last step.
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Regenerate lockfile on Linux
        run: npm install --include=optional --package-lock-only

      - name: Commit and push if changed
        id: sync
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile is already in sync."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync package-lock.json with Linux-shaped npm output"
          git push
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # Both workflows fire on the same push, so Test runs `npm ci` against the
      # Windows-shaped lockfile and fails seconds before the fix lands. The fix
      # commit is pushed with GITHUB_TOKEN, which by design triggers nothing, so
      # nothing re-runs the job this just repaired. Dispatch it explicitly.
      - name: Re-run tests against the synced lockfile
        if: steps.sync.outputs.synced == 'true' && github.event_name == 'push'
        run: gh workflow run test.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
