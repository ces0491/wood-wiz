name: Scrape wood prices

on:
  schedule:
    # Scheduled for 03:00 UTC (05:00 SAST). GitHub starts scheduled runs late
    # under load; in September 2026 they started between 07:07 and 07:39 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run scrapers
        id: scrape
        run: npm run scrape

      # generatedAt, scrapedAt and ranAt all advance on every run, so the file
      # always differs and "no changes" was unreachable — every commit claimed
      # a price refresh whether or not one happened. The scraper compares the
      # catalogue with the timestamps stripped and reports which it was.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/products.json; then
            echo "Nothing to commit."
            exit 0
          fi
          if [ "${{ steps.scrape.outputs.catalogue_changed }}" = "true" ]; then
            MSG="chore(data): refresh wood prices"
          else
            MSG="chore(data): no price changes, refresh timestamps only"
          fi
          git add data/products.json
          git commit -m "$MSG"
          git push

      # After the commit, so the vendors that did scrape still publish. A
      # failed vendor's last good prices are carried forward for a few days
      # (scripts/carry-forward.ts), which is what makes a red run here
      # something to fix soon rather than an outage. It used to be a green run
      # with the failure buried in the log.
      - name: Fail if any vendor failed to scrape
        if: steps.scrape.outputs.vendors_failed != ''
        run: |
          echo "::error::Vendor scrape failed: ${{ steps.scrape.outputs.vendors_failed }}"
          exit 1
